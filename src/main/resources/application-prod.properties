# Production Profile Configuration

# Server Configuration
server.port=8080

# MySQL Database Configuration - Production
spring.datasource.url=jdbc:mysql://localhost:3306/circlehub_db?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Configuration - Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging Configuration - Production
logging.level.com.circlehub=INFO
logging.level.org.springframework.security=WARN
